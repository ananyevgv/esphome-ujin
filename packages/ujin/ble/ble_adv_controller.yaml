external_components:
  - source: github://Xmister/esphome-smartlampfan-components@nico
    refresh: 0s

ble_adv_controller:
  - id: my_controller
    encoding: zhijia
    variant: v2
   # forced_id: xxxxxx
    index: 1

light:
  - platform: ble_adv_controller
    ble_adv_controller_id: my_controller
    type: cww
    id: light_dimmer1
    name: "Люстра"
    
button:
  - platform: template
    name: Pair
    on_press:
      ble_adv_controller.pair: my_controller
  

  

    